name: build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Cache
      uses: gradle/gradle-build-action@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK Output
      run: |
        mkdir -p output
        cp android/build/outputs/apk/debug/android-debug.apk output/AstroLoop-MODDED.apk || \
        cp app/build/outputs/apk/debug/app-debug.apk output/AstroLoop-MODDED.apk

    - name: Upload Modded APK
      uses: actions/upload-artifact@v4
      with:
        name: AstroLoop-modded-Build
        path: output/AstroLoop-modded.apk
        retention-days: 7
